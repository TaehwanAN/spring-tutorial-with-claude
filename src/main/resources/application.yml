# v 6번째로 적용되는 설정 파일(우선순위: 6): ./src/main/resources/application.yml
# 5번째로 적용되는 설정 파일(우선순위: 5): ./src/main/resources/application-{profile}.yml
# 4번째로 적용되는 설정 파일(우선순위: 4): ./application.yml
# 3번째로 적용되는 설정 파일(우선순위: 3): ./appliction-{profile}.yml
# 2번째로 적용되는 설정 파일(우선순위: 2): ./config/application.yml
# 1번째로 적용되는 설정 파일(우선순위: 1): ./config/application-{profile}.yml

spring:
  main:
    banner-mode: console
  # application:
  #   admin:
  #     enabled: true # 터미널에서 jconsole로 접속가능. 그러나 현대에는 Actuator를 쓰던가, Prometheus + Grafana 사용한다.
  # threads:
  #   virtual:
  #     enabled: true # 가상 쓰레드 사용(사용 전 반드시 문서 확인해보고 사용여부 검토)

# Config: Actuator
management:
  endpoint:
    health:
      show-details: always # 운영-> when_authorized + Spring Security
      probes:
        enabled: true   # 중요 (Spring Boot 2.3+)
      group:
        readiness:
          include: simple # 클래스명이 SimpleHealthIndicator라면 Bean 이름은 simpleHealthIndicator
          show-details: always # 운영-> when_authorized + Spring Security
        liveness:
          include: livenessState
    startup:
      enabled: true # curl -X POST http://localhost:8080/actuator/startup # 참고: startup 엔드포인트는 단순히 조회(GET)만 하는 것이 아니라, 버퍼링된 데이터를 "소비(Drain)"하는 개념이 포함될 수 있어 주로 POST 메서드를 사용합니다.

  endpoints:
    web:
      exposure:
        include: "health,info,startup" # BufferingApplicationStartup 설정 추가

my:
  secret: ${random.value}
  uuid: ${random.uuid}
  long: ${random.long}

mail: # @ConfigurationProperties 예시
  host: smtp.example.com
  port: 587
  auth-enabled: true
  credentials:
    username: admin
    password: secret-password